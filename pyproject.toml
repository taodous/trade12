[project]
name = "trading-bot"
version = "0.1.0"
description = "Bot de trading en paper trading sur Alpaca, avec protocole d'audit."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.44.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "quantstats>=0.0.86",
    "structlog>=26.1.0",
    "vectorbt>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "audit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "audit", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["vectorbt.*", "quantstats.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["bot.strategy", "bot.risk", "bot.execution"]
branch = true

[tool.coverage.report]
fail_under = 80
